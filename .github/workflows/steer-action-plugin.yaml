name: Steer action plugin
on:
  pull_request:
    paths:
      - 'examples/steer-action-plugin/**'
      - 'plugins/**'
      - '.github/workflows/steer-action-plugin.yaml'
  push:
    branches: [main]
    paths:
      - 'examples/steer-action-plugin/**'
      - 'plugins/**'
      - '.github/workflows/steer-action-plugin.yaml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: examples/steer-action-plugin/package-lock.json
      - uses: foundry-rs/foundry-toolchain@efe890f034d5dae7b46cba68d2c7afba603e5e4f
        with:
          version: v1.8.3
      - name: Install existing plugin runtime dependencies
        run: |
          npm install -g pnpm@10
          pnpm --dir plugins install --frozen-lockfile --ignore-scripts
      - name: Install action plugin dependencies
        working-directory: examples/steer-action-plugin
        run: npm ci --ignore-scripts
      - name: Check runtime, types, formatting and EVM behavior
        working-directory: examples/steer-action-plugin
        run: npm run validate
